[config]
model = "openai/glm-5.3"
fallback_models = ["openai/deepseek-v4-pro"]
# Zen model names aren't in litellm's model map, so pr-agent can't infer the
# context window; set it explicitly to avoid a "could not resolve model" error.
custom_model_max_tokens = 128000
ai_timeout = 90
max_output_tokens = 4096

[pr_reviewer]
extra_instructions = "Focus on TypeScript/Deno best practices, error handling, and security."

[github_action_config]
auto_review = true
auto_describe = true
auto_improve = true